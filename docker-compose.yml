version: '3.8'

services:
  rentfair:
    build:
      context: .
      dockerfile: Dockerfile
    image: rentfair:latest
    container_name: rentfair-web
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - SERPAPI_API_KEY=${SERPAPI_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-jdbc:h2:mem:rentfair;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 25s

  # Optional PostgreSQL database (if persistent relational database is preferred over in-memory H2)
  postgres:
    image: postgres:16-alpine
    container_name: rentfair-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rentfair
      POSTGRES_USER: ${DATABASE_USERNAME:-rentfair}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-rentfair_secure_pass}
    volumes:
      - rentfair_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-rentfair} -d rentfair"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - with-postgres

volumes:
  rentfair_pgdata:
