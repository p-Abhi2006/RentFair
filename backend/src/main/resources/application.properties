server.port=${PORT:8080}

# Application Name
spring.application.name=rentfair-backend

# DataSource: Uses PostgreSQL when DATABASE_URL is supplied; defaults to H2 PostgreSQL mode for zero-docker local dev
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:rentfair;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Caching: Lightweight in-memory ConcurrentMapCache
spring.cache.type=simple
spring.cache.cache-names=rentalSearches,marketBaselines

# SerpApi Configuration
serpapi.base-url=https://serpapi.com/search
serpapi.engine=google
serpapi.api-key=${SERPAPI_API_KEY:}
serpapi.timeout-seconds=15

# CORS configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4173}
